name: Tusko AI Code Auditor & CI Integrity

on:
  push:
    branches-ignore:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  audit-and-verify:
    name: OpenCode AI & Architectural Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v20
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Frontend Build Integrity
        working-directory: frontend
        run: npm run build

      - name: Run Tusko Agent Pre-Commit Audits
        run: |
          chmod +x .githooks/audits/*.sh
          echo "Running Tusko Code & Architectural Audits..."
          bash .githooks/audits/03-design-system-rounded-none.sh || true
          bash .githooks/audits/07-frontend-consistency-auditor.sh || true
