services:
  # ==========================================
  # 1. Backend API Service (Laravel 12 + Docker)
  # ==========================================
  - type: web
    name: tusko-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: Tusko
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        value: tusko
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDERS
        value: "true"
      - key: MIDTRANS_NOTIFICATION_URL
        value: "https://tusko.onrender.com/api/webhooks/midtrans"
      # T39.2: scheduler berjalan di background web service (Render free tidak
      # mendukung Cron Job/Background Worker berbayar). Set "false" bila kelak
      # memakai Render Cron Job (lihat dokumentasi di bawah).
      - key: RUN_SCHEDULER
        value: "true"

  # ==========================================
  # 2. Frontend Storefront (React Vite SPA)
  # ==========================================
  - type: web
    name: tusko
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tusko-api
          property: host

# ==============================================================================
# T39.2 — Scheduler Produksi (opsi)
# ==============================================================================
# Kondisi saat ini (Render FREE): scheduler dijalankan DI DALAM web service
# backend oleh `docker/entrypoint.sh` (`php artisan schedule:work &`, env
# RUN_SCHEDULER). Ini menjalankan `orders:cancel-expired` tiap 10 menit selama
# instance hidup. Log: `storage/logs/scheduler.log` (juga stderr container).
#
# Jika kelak memakai plan BERBAYAR, lebih andal membuat Cron Job khusus (berjalan
# terlepas dari web service). Contoh blok (hapus komentar untuk mengaktifkan),
# lalu set RUN_SCHEDULER=false pada service web agar tidak dobel:
#
#   - type: cron
#     name: tusko-scheduler
#     runtime: docker
#     dockerfilePath: backend/Dockerfile
#     dockerContext: backend
#     schedule: "* * * * *"        # tiap menit (Laravel schedule:run memfilter)
#     dockerCommand: php artisan schedule:run
#     region: singapore
#     plan: 0.5c-512mb             # cron job tidak tersedia di plan free
#     envVars:
#       - fromGroup: tusko-api-env # (opsional) grup env yang sama
# ==============================================================================
